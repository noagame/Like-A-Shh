name: QA
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run qa
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-placeholder
          NEXT_PUBLIC_SITE_URL: https://example.com
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55439:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - run: psql "$QA_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/database/fixture.sql -f supabase/migrations/202609090001_security.sql
        env:
          QA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55439/postgres
      - run: python3 tests/database/run.py
        env:
          QA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55439/postgres
